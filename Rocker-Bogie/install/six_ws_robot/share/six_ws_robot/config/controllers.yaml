controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

wheel_velocity_controller:
  ros__parameters:
    joints:
      - lf_wheel_joint
      - lm_wheel_joint
      - lr_wheel_joint
      - rf_wheel_joint
      - rm_wheel_joint
      - rr_wheel_joint
    interface_name: velocity
